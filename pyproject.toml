[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ych-bot"
version = "0.1.0"
description = "YCH local QQ assistant built on NapCat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.20",
  "tzdata>=2024.1; platform_system == 'Windows'",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[project.scripts]
ych-bot = "ych_bot.__main__:main"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
"ych_bot.qualification.price_catalogs" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
  "domain: pure domain logic, no database, no HTTP, no adapters",
  "adapters: external clients and launcher scripts against fake transports",
  "repository: SQLite schema and persistence behaviour",
  "services: application services on a temporary database",
  "dashboard: authenticated operator HTTP surface",
  "qualification: model qualification vertical",
  "acceptance: cross-cutting production gates and end-to-end flows",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
